# SHARKCARD — the clock. Every hour: the 1% fee USDC buys $SHARK on Jupiter and burns it (/api/burn).
# The route does nothing until SHARK_MINT is set on Vercel, and throttles itself, so this job is safe to run early.
# Repo → Settings → Secrets and variables → Actions:
#   variable SITE_URL     the live site, no trailing slash (for example https://sharkcard.vercel.app)
#                         (a secret named SITE_URL works too; the variable wins)
#   secret   CRON_SECRET  optional: the same value as CRON_SECRET on Vercel. Without it the route is open and
#                         self-throttles to one run per 5 minutes, and this job still works.
# Until SITE_URL is set the job does nothing and passes.
name: burn
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: burn
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Buy and burn $SHARK
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL is not set yet"; exit 0; fi
          AUTH=(); if [ -n "$CRON_SECRET" ]; then AUTH=(-H "Authorization: Bearer $CRON_SECRET"); fi
          curl -sS --max-time 90 -X POST "${AUTH[@]}" "${SITE_URL%/}/api/burn" | head -c 2000
